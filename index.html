    <script>
      (function() {
        // Polyfill/enable writable fetch on window so extensions (e.g. requests.js) can intercept without throwing getter-only error
        try {
          var _rawFetch = window.fetch;
          if (_rawFetch) {
            var _activeFetch = _rawFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _activeFetch;
              },
              set: function(newFetch) {
                _activeFetch = newFetch;
              }
            });
          }
        } catch (_) {}

        // Prevent external chrome extension content-script errors from breaking the page error boundary
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
